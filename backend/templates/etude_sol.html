<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfroAgri - Tableau de Bord du Sol</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f0; margin: 0; padding: 20px; color: #333; }
        .dashboard { max-width: 900px; margin: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .full-width { grid-column: 1 / span 2; }
        h2 { color: #2e7d32; margin-top: 0; font-size: 20px; border-bottom: 2px solid #e8f5e9; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .btn { width: 100%; padding: 14px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #1b5e20; }
        
        /* Result styling */
        #result { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; line-height: 1.6; }
        .result-box { background: #e8f5e9; border-left: 5px solid #2e7d32; }
        .fertilite-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; }
        
        /* History Table */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th { text-align: left; background: #f8fcf8; padding: 12px; border-bottom: 2px solid #e8f5e9; }
        td { padding: 12px; border-bottom: 1px solid #f0f0f0; }
        
        @media (max-width: 768px) { .dashboard { grid-template-columns: 1fr; } .full-width { grid-column: 1; } }
    </style>
    <style>
        /* ... styles existants ... */
        #video { width: 100%; border-radius: 10px; background: #000; display: none; margin-bottom: 10px; }
        #preview { width: 100%; border-radius: 10px; display: none; border: 3px solid #2e7d32; margin-bottom: 10px; }
        #canvas { display: none; }
        .btn-capture { background: #e65100; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- FORMULAIRE -->
    <div class="card">
        <h2>🧪 Nouvelle Analyse</h2>
        
        <!-- CAMERA SECTION -->
        <div style="text-align:center;">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <img id="preview" alt="Scan du sol">
            <button class="btn btn-green" id="btn-start">📷 Ouvrir Caméra</button>
            <button class="btn btn-capture" id="btn-capture" style="display:none;">🔴 Scanner le Sol</button>
        </div>

        <!-- CONTENEUR DU FORMULAIRE CACHÉ INITIALEMENT -->
        <div id="form-container" style="display: none; margin-top: 20px; border-top: 1px solid #eee; pt: 20px;">
            <div class="form-group">
                <label>Date de l'Analyse (Automatique)</label>
                <input type="text" id="date_analyse" readonly style="background:#f9f9f9;">
            </div>

            <div class="form-group">
                <label>Sélectionner le Champ</label>
                <div style="display: flex; gap: 10px;">
                    <select id="id_champ" style="flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px;">
                        <option value="">Chargement des champs...</option>
                    </select>
                    <button class="btn" style="width: 50px; padding: 0; margin-top: 0;" onclick="toggleNewChampForm()">➕</button>
                </div>
            </div>

            <!-- NEW CHAMP FORM (HIDDEN) -->
            <div id="new-champ-form" style="display: none; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px dashed #2e7d32;">
                <h4 style="margin-top: 0; color: #2e7d32; font-size: 14px;">Nouveau Champ</h4>
                <div class="form-group">
                    <input type="number" id="new-superficie" placeholder="Superficie (ha)" step="0.1">
                </div>
                <div class="form-group">
                    <select id="new-source-eau" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd;">
                        <option value="Pluie">Pluie</option>
                        <option value="Forage">Forage</option>
                        <option value="Irrigation">Irrigation</option>
                        <option value="Riviere">Riviere</option>
                    </select>
                </div>
                <button class="btn btn-green" style="padding: 10px; font-size: 12px;" onclick="creerChamp()">Enregistrer le Champ</button>
            </div>

            <div class="form-group">
                <label>pH du Sol (0-14)</label>
                <input type="number" id="ph_sol" step="0.1" value="6.5">
            </div>
            
            <div class="form-group">
                <label>Azote (N) - mg/kg</label>
                <input type="number" id="azote" value="20">
            </div>
            <div class="form-group">
                <label>Phosphore (P) - mg/kg</label>
                <input type="number" id="phosphore" value="15">
            </div>
            <div class="form-group">
                <label>Potassium (K) - mg/kg</label>
                <input type="number" id="potassium" value="18">
            </div>
            <div class="form-group">
                <label>Matière Organique (%)</label>
                <input type="number" id="matiere_organique" value="2.5">
            </div>
            <div class="form-group">
                <label>Type de Sol</label>
                <input type="text" id="type_sol" value="Argilo-limoneux">
            </div>
            <button class="btn" onclick="analyserSol()">Générer Rapport IA</button>
        </div>
    </div>

    <!-- RESULTAT IA -->
    <div class="card">
        <h2>📊 Diagnostic IA</h2>
        <div id="no-result" style="text-align:center; color:#999; padding:40px;">
            Saisissez les données à gauche pour voir l'analyse.
        </div>
        <div id="result" class="result-box">
            <div style="margin-bottom:10px;">
                <strong>Statut : </strong> <span id="res-fertilite" class="fertilite-badge"></span>
            </div>
            <div id="res-rapport" style="font-size: 14px; color: #444;"></div>
        </div>
    </div>

    <!-- HISTORIQUE -->
    <div class="card full-width">
        <h2>📜 Historique des Études</h2>
        <table id="history-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>ID Champ</th>
                    <th>Type de Sol</th>
                    <th>pH</th>
                    <th>N-P-K</th>
                    <th>Fertilité</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="history-body">
                <!-- Rempli par JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Helper pour récupérer le token CSRF de Django
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    async function chargerHistorique() {
        try {
            const res = await fetch('/api/etude-sol/');
            const data = await res.json();
            const body = document.getElementById('history-body');
            body.innerHTML = '';
            
            data.forEach(item => {
                const row = `<tr>
                    <td>${new Date(item.created_at).toLocaleDateString()}</td>
                    <td><strong style="color:#2e7d32">#${item.id_champ}</strong></td>
                    <td>${item.type_sol}</td>
                    <td>${item.ph_sol}</td>
                    <td>${item.azote}-${item.phosphore}-${item.potassium}</td>
                    <td><span class="fertilite-badge" style="background:#e8f5e9; color:#2e7d32">${item.fertilite}</span></td>
                    <td><button style="border:none; background:none; color:#1565c0; cursor:pointer" onclick='voirDetails(${JSON.stringify(item)})'>Détails</button></td>
                </tr>`;
                body.innerHTML += row;
            });
        } catch (e) { console.error("Erreur historique", e); }
    }

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const preview = document.getElementById('preview');
    const btnStart = document.getElementById('btn-start');
    const btnCapture = document.getElementById('btn-capture');
    let capturedBlob = null;
    let stream = null;

    btnStart.onclick = async () => {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            video.srcObject = stream;
            video.style.display = 'block';
            btnCapture.style.display = 'inline-block';
            btnStart.style.display = 'none';
            preview.style.display = 'none';
        } catch (e) { alert("Erreur caméra : " + e.message); }
    };

    btnCapture.onclick = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        canvas.toBlob(async blob => {
            capturedBlob = blob;
            preview.src = URL.createObjectURL(blob);
            preview.style.display = 'block';
            video.style.display = 'none';
            btnCapture.style.display = 'none';
            btnStart.style.display = 'inline-block';
            btnStart.innerText = "🔄 Reprendre le Scan";
            if (stream) stream.getTracks().forEach(t => t.stop());

            // --- AFFICHAGE DU FORMULAIRE ---
            document.getElementById('form-container').style.display = 'block';

            // --- Extraction automatique des données ---
            const formData = new FormData();
            formData.append('image', blob, 'sol.jpg');
            
            document.getElementById('no-result').innerHTML = "⏳ Extraction des données IA en cours...";
            document.getElementById('no-result').style.display = 'block';
            
            try {
                const res = await fetch('/api/etude-sol/extraire-donnees/', {
                    method: 'POST',
                    headers: { 'X-CSRFToken': getCookie('csrftoken') },
                    body: formData
                });
                const result = await res.json();
                if (res.ok) {
                    const s = result.suggestions;
                    document.getElementById('ph_sol').value = s.ph_sol;
                    document.getElementById('azote').value = s.azote;
                    document.getElementById('phosphore').value = s.phosphore;
                    document.getElementById('potassium').value = s.potassium;
                    document.getElementById('matiere_organique').value = s.matiere_organique;
                    document.getElementById('type_sol').value = s.type_sol;
                    
                    document.getElementById('no-result').innerHTML = `✅ Données extraites ! <br><small>${s.observation}</small>`;
                    document.getElementById('no-result').style.color = "#2e7d32";
                } else {
                    document.getElementById('no-result').innerHTML = "❌ Erreur lors de l'extraction.";
                }
            } catch (e) { 
                console.error("Erreur extraction", e);
                document.getElementById('no-result').innerHTML = "❌ Erreur réseau lors de l'extraction.";
            }
        }, 'image/jpeg');
    };

    async function chargerChamps() {
        try {
            const res = await fetch('/api/champs/');
            const data = await res.json();
            const select = document.getElementById('id_champ');
            const currentVal = select.value;
            select.innerHTML = '<option value="">-- Sélectionner un champ --</option>';
            data.forEach(champ => {
                select.innerHTML += `<option value="${champ.id_champ}">Champ #${champ.id_champ} (${champ.superficie} ha)</option>`;
            });
            if (currentVal) select.value = currentVal;
        } catch (e) { console.error("Erreur chargement champs", e); }
    }

    function initDate() {
        const today = new Date().toLocaleDateString('fr-FR');
        document.getElementById('date_analyse').value = today;
    }

    async function analyserSol() {
        const idChamp = document.getElementById('id_champ').value;
        if (!idChamp) { alert("Veuillez sélectionner un champ."); return; }

        const formData = new FormData();
        formData.append('id_champ', idChamp);
        formData.append('ph_sol', document.getElementById('ph_sol').value);
        formData.append('azote', document.getElementById('azote').value);
        formData.append('phosphore', document.getElementById('phosphore').value);
        formData.append('potassium', document.getElementById('potassium').value);
        formData.append('matiere_organique', document.getElementById('matiere_organique').value);
        formData.append('type_sol', document.getElementById('type_sol').value);
        formData.append('humidite', 40);
        
        if (capturedBlob) {
            formData.append('image', capturedBlob, 'sol.jpg');
        }

        try {
            const res = await fetch('/api/etude-sol/analyser/', {
                method: 'POST',
                headers: { 'X-CSRFToken': getCookie('csrftoken') },
                body: formData
            });
            
            const result = await res.json();
            if (res.ok) {
                document.getElementById('no-result').style.display = 'none';
                document.getElementById('result').style.display = 'block';
                document.getElementById('res-fertilite').innerText = result.analyse_ia.fertilite;
                document.getElementById('res-rapport').innerText = result.analyse_ia.rapport_analyse;
                chargerHistorique();
            } else {
                alert("Erreur lors de l'analyse : " + (result.error || "Inconnue"));
            }
        } catch (e) { alert("Erreur réseau lors de l'analyse."); }
    }

    function voirDetails(item) {
        alert("Rapport Complet :\n\n" + item.rapport_analyse);
    }

    function toggleNewChampForm() {
        const form = document.getElementById('new-champ-form');
        form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }

    async function creerChamp() {
        const superficie = document.getElementById('new-superficie').value;
        const source_eau = document.getElementById('new-source-eau').value;
        
        if (!superficie) { alert("Saisissez la superficie"); return; }

        try {
            const res = await fetch('/api/champs/', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    superficie: superficie,
                    source_eau: source_eau,
                    longitude: 0,
                    latitude: 0
                })
            });
            const data = await res.json();
            if (res.ok) {
                alert("Champ créé !");
                toggleNewChampForm();
                await chargerChamps();
                document.getElementById('id_champ').value = data.id_champ;
            } else {
                alert("Erreur lors de la création du champ.");
            }
        } catch (e) { console.error("Erreur création champ", e); }
    }

    // Chargement initial
    chargerHistorique();
    chargerChamps();
    initDate();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfroAgri - Scan Plante (Auto)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f0;
            color: #333;
        }

        header {
            background: #2e7d32;
            color: white;
            padding: 16px 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .container {
            max-width: 480px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #2e7d32;
            margin-bottom: 14px;
            font-size: 16px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 10px;
        }

        #video {
            width: 100%;
            border-radius: 10px;
            background: #000;
            display: none;
        }

        #canvas { display: none; }

        #preview {
            width: 100%;
            border-radius: 10px;
            display: none;
            border: 3px solid #2e7d32;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            min-width: 120px;
        }

        .btn-green  { background: #2e7d32; color: white; }
        .btn-blue   { background: #1565c0; color: white; }
        .btn-grey   { background: #9e9e9e; color: white; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }

        .upload-label {
            display: block;
            padding: 12px;
            background: #e8f5e9;
            border: 2px dashed #2e7d32;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            color: #2e7d32;
            margin-top: 10px;
        }

        #file-input { display: none; }

        #loader {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            width: 48px; height: 48px;
            border: 5px solid #e0e0e0;
            border-top-color: #2e7d32;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #result { display: none; }

        .result-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .result-icon { font-size: 40px; }
        .result-title { font-size: 20px; font-weight: bold; }
        .result-subtitle { font-size: 13px; color: #666; margin-top: 2px; }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        .info-row:last-child { border-bottom: none; }

        .info-label { color: #888; }
        .info-value { font-weight: bold; max-width: 60%; text-align: right; word-break: break-word; }

        .success-banner {
            background: #e8f5e9;
            border-left: 4px solid #2e7d32;
            padding: 14px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
            color: #2e7d32;
        }

        .status-text {
            margin-top: 8px;
            font-size: 13px;
            color: #666;
            min-height: 20px;
        }

        .geo-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 12px;
            color: #1565c0;
        }

        .geo-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1565c0;
        }

        .geo-indicator.active {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.4; }
        }
    </style>
</head>
<body>

<header>📱 AfroAgri — Scan Plante (Automatisé)</header>

<div class="container">

    <!-- SAISIE PLANTE -->
    <div class="card">
        <h3>📋 Nom de la plante (optionnel)</h3>
        <input type="text" id="nom-plante" placeholder="Ex: tomate, pomme, raisin...">
        <div class="geo-status">
            <span class="geo-indicator active"></span>
            <span id="geo-text">Initialisation de la localisation...</span>
        </div>
    </div>

    <!-- CAMÉRA -->
    <div class="card">
        <h3>📷 Capturer la plante</h3>

        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <img id="preview" alt="Photo capturée">

        <div class="btn-row">
            <button class="btn btn-green" id="btn-start">📷 Ouvrir caméra</button>
            <button class="btn btn-blue" id="btn-capture" disabled style="display:none;">🔴 Capturer</button>
        </div>

        <label class="upload-label" for="file-input">
            📁 Ou choisir une image depuis la galerie
        </label>
        <input type="file" id="file-input" accept="image/*" capture="environment">

        <div class="btn-row" style="margin-top: 16px;">
            <button class="btn btn-blue" id="btn-analyser" disabled>🚀 Analyser et enregistrer</button>
        </div>
    </div>

    <!-- LOADER -->
    <div class="card" id="loader">
        <div class="spinner"></div>
        <p style="color:#555; font-size:14px;">Analyse IA en cours...<br>Traitement de l'image et extraction des données</p>
    </div>

    <!-- RÉSULTAT & CONFIRMATION AUTO -->
    <div class="card" id="result"></div>

</div>

<script>
    const video      = document.getElementById('video');
    const canvas     = document.getElementById('canvas');
    const preview    = document.getElementById('preview');
    const btnStart   = document.getElementById('btn-start');
    const btnCapture = document.getElementById('btn-capture');
    const btnAnalyser= document.getElementById('btn-analyser');
    const fileInput  = document.getElementById('file-input');
    const loader     = document.getElementById('loader');
    const resultDiv  = document.getElementById('result');
    const nomPlanteInput = document.getElementById('nom-plante');
    const geoText    = document.getElementById('geo-text');

    let stream = null;
    let capturedBlob = null;
    let latitude = null;
    let longitude = null;
    let geoSource = 'unknown'; // 'native', 'ip', 'fallback'

    // === FONCTION PRINCIPALE: Récupérer GPS avec fallbacks ===
    async function getGPSCoordinates() {
        console.log('[GPS] Début de la récupération GPS');
        
        // 1. Essayer le GPS natif d'abord
        const nativeGps = await getNativeGeolocation();
        if (nativeGps) {
            console.log('[GPS] GPS natif réussi:', nativeGps);
            latitude = nativeGps.lat;
            longitude = nativeGps.lon;
            geoSource = 'native';
            geoText.textContent = `✅ GPS natif: ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
            return true;
        }

        // 2. Essayer le fallback IP
        console.log('[GPS] GPS natif échoué, tentative du fallback IP');
        const ipGeo = await getLocationFromIP();
        if (ipGeo) {
            console.log('[GPS] IP geolocation réussi:', ipGeo);
            latitude = ipGeo.lat;
            longitude = ipGeo.lon;
            geoSource = 'ip';
            geoText.textContent = `📍 Localisation approximative (IP): ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
            return true;
        }

        // 3. Fallback ultime: coordonnées par défaut (université/école)
        console.log('[GPS] Fallback IP échoué, utilisation des coordonnées par défaut');
        latitude = 48.8566; // Paris
        longitude = 2.3522;
        geoSource = 'fallback';
        geoText.textContent = `⚠️ Position par défaut: ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
        return true;
    }

    // === GPS natif ===
    function getNativeGeolocation() {
        return new Promise(resolve => {
            if (!navigator.geolocation) {
                console.log('[GPS] navigator.geolocation non disponible');
                return resolve(null);
            }

            geoText.textContent = '🔄 Demande GPS natif...';
            navigator.geolocation.getCurrentPosition(
                position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    console.log('[GPS] Succès GPS natif:', { lat, lon, accuracy: position.coords.accuracy });
                    resolve({ lat, lon });
                },
                error => {
                    console.warn('[GPS] Erreur GPS natif:', error.code, error.message);
                    resolve(null);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0,
                }
            );
        });
    }

    // === Fallback IP ===
    async function getLocationFromIP() {
        try {
            console.log('[GPS] Tentative localisation par IP...');
            const response = await fetch('https://ipapi.co/json/', { timeout: 5000 });
            if (!response.ok) {
                console.warn('[GPS] ipapi.co retourné:', response.status);
                return null;
            }
            const data = await response.json();
            const lat = parseFloat(data.latitude);
            const lon = parseFloat(data.longitude);
            
            if (isValidCoordinates(lat, lon)) {
                console.log('[GPS] IP localisation réussi:', { lat, lon, city: data.city });
                return { lat, lon };
            } else {
                console.warn('[GPS] Coordonnées IP invalides:', { lat, lon });
                return null;
            }
        } catch (e) {
            console.warn('[GPS] Erreur ipapi.co:', e.message);
            return null;
        }
    }

    // === Validation GPS ===
    function isValidCoordinates(lat, lon) {
        return (
            typeof lat === 'number' && typeof lon === 'number' &&
            !isNaN(lat) && !isNaN(lon) &&
            lat !== 0 && lon !== 0 &&
            lat >= -90 && lat <= 90 &&
            lon >= -180 && lon <= 180
        );
    }

    // === Initialisation au chargement ===
    window.addEventListener('load', async () => {
        console.log('[INIT] Chargement de la page');
        await getGPSCoordinates();
        console.log('[INIT] GPS initial défini:', { latitude, longitude, source: geoSource });
    });

    // --- Ouvrir la caméra ---
    btnStart.addEventListener('click', async () => {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: 1280, height: 720 }
            });
            video.srcObject = stream;
            video.style.display = 'block';
            preview.style.display = 'none';
            btnCapture.style.display = 'inline-flex';
            btnCapture.disabled = false;
            btnStart.style.display = 'none';
            btnAnalyser.disabled = true;
            capturedBlob = null;
        } catch (e) {
            alert('Caméra non disponible : ' + e.message);
        }
    });

    // --- Capturer la photo ---
    btnCapture.addEventListener('click', () => {
        canvas.width  = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        canvas.toBlob(blob => {
            capturedBlob = blob;
            preview.src = URL.createObjectURL(blob);
            preview.style.display = 'block';
            video.style.display = 'none';
            if (stream) stream.getTracks().forEach(t => t.stop());
            btnCapture.style.display = 'none';
            btnStart.style.display = 'inline-flex';
            btnAnalyser.disabled = false;
        }, 'image/jpeg', 0.9);
    });

    // --- Upload depuis galerie ---
    fileInput.addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        capturedBlob = file;
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        video.style.display = 'none';
        if (stream) stream.getTracks().forEach(t => t.stop());
        btnAnalyser.disabled = false;
        btnCapture.style.display = 'none';
        btnStart.style.display = 'inline-flex';
    });

    // --- Analyser et enregistrer automatiquement ---
    btnAnalyser.addEventListener('click', async () => {
        if (!capturedBlob) { alert('Veuillez capturer ou choisir une image.'); return; }

        loader.style.display = 'block';
        resultDiv.style.display = 'none';
        resultDiv.innerHTML = '';
        btnAnalyser.disabled = true;

        // Récupérer GPS au moment du scan
        await getGPSCoordinates();
        console.log('[SCAN] Démarrage analyse avec GPS:', { latitude, longitude, source: geoSource });

        // Vérifier que latitude et longitude existent
        if (latitude === null || longitude === null) {
            loader.style.display = 'none';
            afficherErreur('❌ Erreur: Impossible de récupérer les coordonnées GPS.');
            btnAnalyser.disabled = false;
            return;
        }

        const formData = new FormData();
        formData.append('image', capturedBlob, 'plante.jpg');
        formData.append('nom_plante', nomPlanteInput.value || 'plante inconnue');
        formData.append('latitude', latitude);
        formData.append('longitude', longitude);

        console.log('[SCAN] Envoi au serveur:', {
            latitude,
            longitude,
            nom_plante: nomPlanteInput.value,
            source: geoSource
        });

        try {
            const resp = await fetch('/api/journal/analyser-image/', {
                method: 'POST',
                body: formData
            });
            const data = await resp.json();
            loader.style.display = 'none';

            if (!resp.ok) {
                console.error('[SCAN] Erreur serveur:', data);
                afficherErreur(data.error || 'Erreur serveur.');
                btnAnalyser.disabled = false;
                return;
            }

            console.log('[SCAN] Succès serveur:', data);
            afficherSucces(data);
        } catch (e) {
            loader.style.display = 'none';
            console.error('[SCAN] Erreur réseau:', e);
            afficherErreur('Impossible de contacter le serveur.');
            btnAnalyser.disabled = false;
        }
    });

    // --- Afficher le succès ---
    function afficherSucces(data) {
        const j = data.journal || {};
        const ia = data.ia_analysis || {};
        const estSaine = ia.est_saine;

        resultDiv.innerHTML = `
            <div class="success-banner">
                ✅ Journal #${data.id_journal} enregistré automatiquement
            </div>

            <div class="result-header">
                <div class="result-icon">${estSaine ? '✅' : '🔴'}</div>
                <div>
                    <div class="result-title">${estSaine ? 'Plante Saine' : 'Maladie Détectée'}</div>
                    <div class="result-subtitle">${ia.plante || ''}</div>
                </div>
            </div>

            <div class="info-row">
                <span class="info-label">Date d'observation</span>
                <span class="info-value">${j.date_observation || ''}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Stade de croissance</span>
                <span class="info-value">${j.stade_croissance || ''}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Symptômes</span>
                <span class="info-value">${j.symptomes || ''}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Ravageur suspecté</span>
                <span class="info-value">${j.ravageur_suspecte || 'Aucun'}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Maladie suspectée</span>
                <span class="info-value">${j.maladie_suspecte || 'Aucune'}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Confiance IA</span>
                <span class="info-value">${ia.confiance || 0}%</span>
            </div>
            <div class="info-row">
                <span class="info-label">Traitement</span>
                <span class="info-value">${ia.traitement || 'Consulter un agronome'}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Coordonnées GPS (${geoSource})</span>
                <span class="info-value">${j.latitude || 0}, ${j.longitude || 0}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Google Maps</span>
                <span class="info-value"><a href="https://www.google.com/maps/search/?api=1&query=${j.latitude},${j.longitude}" target="_blank" style="color:#1565c0;">Ouvrir dans Maps</a></span>
            </div>

            <div class="btn-row" style="margin-top: 16px;">
                <button class="btn btn-green" onclick="location.reload()">🔄 Nouveau scan</button>
            </div>
        `;
        resultDiv.style.display = 'block';
        resultDiv.scrollIntoView({ behavior: 'smooth' });
    }

    // --- Afficher l'erreur ---
    function afficherErreur(msg) {
        resultDiv.innerHTML = `
            <div style="background:#ffebee;border-left:4px solid #c62828;padding:12px;border-radius:6px;color:#c62828;font-size:14px;">
                ${msg}
            </div>
        `;
        resultDiv.style.display = 'block';
    }
</script>

</body>
</html>
